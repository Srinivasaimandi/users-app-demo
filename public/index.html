<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles/indexStyles.css" />
    <link rel="stylesheet" href="./styles/themes/cool.css" />
    <link rel="stylesheet" href="./styles/themes/warm.css" />
    <link rel="stylesheet" href="./styles/themes/fresh.css" />
</head>

<body>
  <a href="https://github.com/Srinivasaimandi/users-app-demo">
    <img style="position: absolute; top: 0; right: 0; border: 0;" src="./images/forkme_right_green_007200.png"
      alt="Fork me on GitHub">
  </a>
  <div class="container py-5">
    <div class="card shadow-lg border-0 overflow-hidden">
      <div class="row g-0">
        <div class="col-lg-7 p-4 p-lg-5 bg-light">
          <div class="h-100 d-flex flex-column justify-content-center">
            <h1 id="title-msg" class="display-5 fw-bold mb-3">Welcome to <span id="theme-toggle">Users</span> App</h1>
            <p class="text-muted mb-4">Manage users, refresh data, and inspect the API from one place.</p>
            <div id="login-credentials" class="alert alert-info small shadow-sm" style="display: none;">
              <a href="#" id="back-arrow" class="btn btn-sm btn-outline-secondary mb-2">&larr; back</a>
              <div class="small">
                <div class="fw-semibold">login using valid credentials</div>
                <div>username: srinivasaimandi</div>
                <div>password: $test123#</div>
              </div>
            </div>
            <div class="d-flex flex-wrap gap-3" id="links">
              <a href="#" id="ui-link" class="btn btn-primary">UI</a>
              <a id="swagger-link" href="#" target="_blank" class="btn btn-outline-primary">Swagger Docs</a>
              <a id="graphql-link" href="#" target="_blank" class="btn btn-outline-primary">GraphQL</a>
            </div>
          </div>
        </div>
        <div class="col-lg-5 p-4 p-lg-5 bg-white">
          <div class="h-100 d-flex flex-column justify-content-center">
            <h2 class="h4 fw-bold mb-3">Login</h2>
            <div class="alert alert-danger py-2" id="login-error" style="display:none;"></div>
            <div class="alert alert-success py-2" id="login-success" style="display:none;"></div>
            <form id="login-form" autocomplete="off">
              <div class="mb-3">
                <input type="text" id="username" name="username" class="form-control" placeholder="Username" required />
              </div>
              <div class="mb-3">
                <input type="password" id="password" name="password" class="form-control" placeholder="Password" required />
              </div>
              <button type="submit" class="btn btn-dark w-100">Login</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./scripts/index.js"></script>
</body>

</html>
