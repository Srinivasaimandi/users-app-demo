<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Users List</title>
  <link rel="stylesheet" href="./styles/usersStyles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
  <a href="https://github.com/Srinivasaimandi/users-app-demo">
    <img style="position: absolute; top: 0; right: 0; border: 0;" src="./images/forkme_right_green_007200.png"
      alt="Fork me on GitHub">
  </a>
  <div class="container">
    <div class="header-row">
      <h1>Users List
        <button id="refresh-btn" class="icon-btn" data-tooltip="Refresh">
          <i class="fas fa-sync-alt fa-2x" style="color: #2c3e50;"></i>
        </button>
        <button id="reset-btn" class="icon-btn" data-tooltip="Reload users">
          <i class="fas fa-rotate-left fa-2x" style="color: #2c3e50;"></i>
        </button>
      </h1>
      <div class="search-container">
        <input type="text" id="search-input" placeholder="Search by name or email..." />
      </div>
      <a href="#" id="logout-link" class="logout-link">Logout</a>
    </div>
    <div class="error" id="error-msg" style="display:none;"></div>
    <table id="users-table" style="display:none;">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Username</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script src="./scripts/usersPage.js">  </script>
</body>

</html>
