<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Users List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles/usersStyles.css" />
  <link rel="stylesheet" href="./styles/themes/cool.css" />
  <link rel="stylesheet" href="./styles/themes/warm.css" />
  <link rel="stylesheet" href="./styles/themes/fresh.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
  <a href="https://github.com/Srinivasaimandi/users-app-demo">
    <img style="position: absolute; top: 0; right: 0; border: 0;" src="./images/forkme_right_green_007200.png"
      alt="Fork me on GitHub">
  </a>
  <div class="container py-5">
    <div class="card shadow-lg border-0">
      <div class="card-body p-4 p-lg-5">
        <div class="users-toolbar mb-3">
          <div class="users-toolbar-top">
            <h1 class="h3 fw-bold m-0 users-title">Users List</h1>
            <div class="users-toolbar-center">
              <div class="users-toolbar-search">
                <input type="text" id="search-input" class="form-control users-search"
                  placeholder="Search by name or email..." />
              </div>
            </div>
            <div class="users-toolbar-right">
              <div class="users-toolbar-actions">
                <button id="add-btn" class="toolbar-btn" data-tooltip="Add user" aria-label="Add user">
                  <i class="fas fa-plus"></i>
                </button>
                <button id="refresh-btn" class="toolbar-btn" data-tooltip="Refresh" aria-label="Refresh users">
                  <i class="fas fa-sync-alt"></i>
                </button>
                <button id="reset-btn" class="toolbar-btn" data-tooltip="Reset data" aria-label="Reset data">
                  <i class="fas fa-rotate-left"></i>
                </button>
              </div>
              <a href="#" id="logout-link" class="btn btn-outline-primary btn-sm">Logout</a>
            </div>
          </div>
        </div>
        <div class="alert alert-danger py-2" id="error-msg" style="display:none;"></div>
        <div class="alert alert-success py-2" id="success-msg" style="display:none;"></div>
        <div class="modal-overlay" id="confirm-delete-modal" aria-hidden="true">
          <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirm-delete-title">
            <div class="modal-header">
              <h2 id="confirm-delete-title" class="h5 m-0">Confirm Delete</h2>
              <button type="button" class="modal-close" id="confirm-delete-close" aria-label="Close">
                <i class="fas fa-times"></i>
              </button>
            </div>
            <div class="modal-body">
              <p id="confirm-delete-message">Are you sure you want to delete this user?</p>
            </div>
            <div class="modal-actions">
              <button type="button" class="btn btn-danger" id="confirm-delete-yes">Delete</button>
              <button type="button" class="btn btn-outline-secondary" id="confirm-delete-no">Cancel</button>
            </div>
          </div>
        </div>
        <div class="modal-overlay" id="add-user-modal" aria-hidden="true">
          <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="add-user-title">
            <div class="modal-header">
              <h2 id="add-user-title" class="h5 m-0">Add User</h2>
              <button type="button" class="modal-close" id="add-user-close" aria-label="Close">
                <i class="fas fa-times"></i>
              </button>
            </div>
            <div class="modal-body">
              <div class="alert alert-danger py-2" id="add-user-error" style="display:none;"></div>
              <form id="add-user-form" novalidate>
                <div class="mb-3">
                  <label for="add-name" class="form-label">Name</label>
                  <input id="add-name" name="name" type="text" class="form-control" required />
                </div>
                <div class="mb-3">
                  <label for="add-email" class="form-label">Email</label>
                  <input id="add-email" name="email" type="email" class="form-control" required />
                </div>
                <div class="mb-3">
                  <label for="add-username" class="form-label">Username</label>
                  <input id="add-username" name="username" type="text" class="form-control" required />
                </div>
                <div class="mb-3">
                  <label for="add-password" class="form-label">Password</label>
                  <input id="add-password" name="password" type="password" class="form-control" required />
                </div>
                <div class="mb-3">
                  <label for="add-status" class="form-label">Status</label>
                  <select id="add-status" name="status" class="form-control" required>
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                  </select>
                </div>
                <div class="modal-actions">
                  <button type="submit" class="btn btn-primary" id="add-user-save">Save</button>
                  <button type="button" class="btn btn-outline-secondary" id="add-user-cancel">Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>
        <div class="modal-overlay" id="edit-user-modal" aria-hidden="true">
          <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="edit-user-title">
            <div class="modal-header">
              <h2 id="edit-user-title" class="h5 m-0">Edit User</h2>
              <button type="button" class="modal-close" id="edit-user-close" aria-label="Close">
                <i class="fas fa-times"></i>
              </button>
            </div>
            <div class="modal-body">
              <div class="alert alert-danger py-2" id="edit-user-error" style="display:none;"></div>
              <form id="edit-user-form" novalidate>
                <input type="hidden" id="edit-user-id" />
                <div class="mb-3">
                  <label for="edit-name" class="form-label">Name</label>
                  <input id="edit-name" name="name" type="text" class="form-control" required />
                </div>
                <div class="mb-3">
                  <label for="edit-email" class="form-label">Email</label>
                  <input id="edit-email" name="email" type="email" class="form-control" required />
                </div>
                <div class="mb-3">
                  <label for="edit-username" class="form-label">Username</label>
                  <input id="edit-username" name="username" type="text" class="form-control" required />
                </div>
                <div class="mb-3">
                  <label for="edit-password" class="form-label">Password</label>
                  <input id="edit-password" name="password" type="password" class="form-control" />
                </div>
                <div class="mb-3">
                  <label for="edit-status" class="form-label">Status</label>
                  <select id="edit-status" name="status" class="form-control" required>
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                  </select>
                </div>
                <div class="modal-actions">
                  <button type="button" class="btn btn-outline-secondary" id="edit-user-download">Download</button>
                  <button type="submit" class="btn btn-primary" id="edit-user-save">Save</button>
                  <button type="button" class="btn btn-outline-secondary" id="edit-user-cancel">Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>
        <div class="toolbar mb-3" style="display: flex; gap: 10px; align-items: center;">
          <button id="export-btn" class="btn btn-outline-info btn-sm" data-tooltip="Export users">
            <i class="fas fa-download"></i> Export
          </button>
          <button id="import-btn" class="btn btn-outline-info btn-sm" data-tooltip="Import users">
            <i class="fas fa-upload"></i> Import
          </button>
          <input type="file" id="import-file" accept=".csv,.json" style="display:none;" />
          <div style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
            <label for="items-per-page" style="margin: 0;">Items per page:</label>
            <select id="items-per-page" class="form-control" style="width: auto;">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="20">20</option>
              <option value="50">50</option>
            </select>
          </div>
        </div>
        <div class="pagination-controls" id="pagination-controls"
          style="display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; align-items: center;">
          <button id="prev-page" class="btn btn-sm btn-outline-primary">← Previous</button>
          <span id="page-info" style="margin: 0 10px;">Page 1</span>
          <button id="next-page" class="btn btn-sm btn-outline-primary">Next →</button>
        </div>
        <div class="table-responsive">
          <table id="users-table" class="table align-middle table-hover" style="display:none;">
            <thead>
              <tr>
                <th style="cursor: pointer;" data-sort="id">ID <i class="fas fa-arrows-alt-v"
                    style="font-size: 0.7em;"></i></th>
                <th style="cursor: pointer;" data-sort="name">Name <i class="fas fa-arrows-alt-v"
                    style="font-size: 0.7em;"></i></th>
                <th style="cursor: pointer;" data-sort="email">Email <i class="fas fa-arrows-alt-v"
                    style="font-size: 0.7em;"></i></th>
                <th style="cursor: pointer;" data-sort="username">Username <i class="fas fa-arrows-alt-v"
                    style="font-size: 0.7em;"></i></th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script src="./scripts/usersPage.js">  </script>
</body>

</html>
